<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#1a1a2e" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Age of Emperors</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        color: #fff;
        font-family: sans-serif;
      }
      #container {
        position: relative;
        width: 100vw;
        height: 100vh;
        background: #000;
      }
      #container canvas {
        border: none !important;
        position: absolute;
      }
      #loader {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-family: sans-serif;
        font-size: 45px;
        color: #fff;
        text-align: center;
        user-select: none;
        z-index: 999;
      }
      #results {
        width: 100%;
        border-collapse: collapse;
        font-family: "verdana";
        white-space: pre;
      }
      #results td {
        border: solid 1px #ccc;
      }
      #results td.FAILED {
        color: #f00;
      }
      #results td.PASSED {
        color: #090;
      }
      #results td.TIMEOUT {
        color: #f90;
      }
      #results td:first-child {
        width: 305px;
      }
      #install-button {
        position: fixed;
        bottom: 16px;
        left: 16px;
        z-index: 1000;
        padding: 10px 16px;
        background: #8b7355;
        color: #fff;
        border: 2px solid #c4a57b;
        border-radius: 6px;
        font-family: sans-serif;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
      }
      #install-button:hover {
        background: #a08868;
      }
      #install-button[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="container"></div>
    <div id="loader">0%</div>
    <table id="results"></table>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
