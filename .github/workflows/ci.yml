name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install JS deps
        run: npm ci

      - name: Bundle sprites
        run: npm run bundle-images

      - name: Generate procedural sounds
        run: npm run generate-sounds

      - name: Build
        run: npm run build

      - name: Determinism test (RNG cross-check)
        run: node tests/determinism.test.js

  determinism:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: node tests/determinism.test.js
